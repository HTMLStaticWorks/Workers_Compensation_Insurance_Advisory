<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | WorkGuard Advisory</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bg-main) 0%, var(--bg-secondary) 100%);
            padding: 2rem;
            font-family: var(--font-body);
        }
        
        .auth-card {
            background: var(--bg-tertiary);
            width: 100%;
            max-width: 440px;
            border-radius: 24px;
            padding: 3rem 2.5rem;
            box-shadow: 0 12px 40px rgba(0,0,0,0.06);
            border: 1px solid var(--border-color);
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .auth-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        
        .auth-subtitle {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--blue-primary);
            margin-bottom: 1rem;
            font-family: var(--font-heading);
        }
        
        .auth-title {
            font-size: 2.5rem;
            font-family: var(--font-heading);
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            line-height: 1.1;
        }
        
        .auth-desc {
            color: var(--text-secondary);
            font-size: 0.9375rem;
        }
        
        .auth-form .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }
        [dir="rtl"] .auth-form .form-group {
            text-align: right;
        }
        
        .auth-form .form-label {
            font-size: 0.8125rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-family: var(--font-heading);
        }
        
        .auth-form .form-control {
            border-radius: 12px;
            padding: 0.875rem 1rem;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }
        
        .auth-form .form-control:focus {
            border-color: var(--blue-primary);
            box-shadow: 0 0 0 3px var(--blue-light);
        }
        
        .auth-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }
        
        .auth-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 500;
        }
        
        .auth-checkbox input {
            width: 16px;
            height: 16px;
            accent-color: var(--blue-primary);
            border-radius: 4px;
            cursor: pointer;
        }
        
        .auth-link {
            color: var(--blue-primary);
            font-weight: 700;
            text-decoration: none;
        }
        
        .auth-link:hover {
            text-decoration: underline;
        }
        
        .auth-btn {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            background: var(--blue-primary);
            color: #fff;
            font-weight: 800;
            font-size: 1rem;
            font-family: var(--font-heading);
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1.5rem;
        }
        
        .auth-btn:hover {
            background: var(--blue-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.2);
        }
        
        .auth-divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }
        
        .auth-divider::before, .auth-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }
        .auth-divider::before { margin-right: 1rem; }
        .auth-divider::after { margin-left: 1rem; }
        
        .social-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.875rem;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-weight: 700;
            font-size: 0.9375rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .social-btn:hover {
            background: var(--bg-secondary);
        }
        
        .auth-footer {
            text-align: center;
            font-size: 0.9375rem;
            color: var(--text-secondary);
        }
        
        @media (max-width: 480px) {
            .auth-card {
                padding: 2.5rem 1.5rem;
                border-radius: 20px;
            }
            .auth-title {
                font-size: 2rem;
            }
            .auth-actions {
                font-size: 0.8rem;
                white-space: nowrap;
                gap: 0.5rem;
            }
            .auth-checkbox, .auth-link {
                white-space: nowrap;
            }
        }
        
        /* Light/Dark Toggle for Auth */
        .auth-toggles {
            position: absolute;
            top: 2rem;
            right: 2rem;
            display: flex;
            gap: 0.5rem;
        }
        [dir="rtl"] .auth-toggles {
            right: auto;
            left: 2rem;
        }
        .auth-theme-toggle,
        .auth-dir-toggle {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
        }
        @media (max-width: 768px) {
            .auth-wrapper {
                flex-direction: column;
                justify-content: center;
                padding: 1.5rem;
            }
            .auth-toggles {
                position: relative;
                top: 0;
                right: 0;
                width: 100%;
                max-width: 480px;
                justify-content: flex-end;
                margin-bottom: 1rem;
            }
            [dir="rtl"] .auth-toggles {
                left: 0;
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-toggles">
            <button class="auth-theme-toggle js-theme-toggle" aria-label="Toggle Theme"></button>
            <button class="auth-dir-toggle js-dir-toggle" aria-label="Toggle RTL">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 9H7M21 9L17 5M21 9L17 13M3 15h14M3 15l4-4M3 15l4 4"/>
                </svg>
            </button>
        </div>
        
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <div style="display: flex; align-items: center; justify-content: center; gap: 0.75rem;"><img src="assets/logo/favicon.svg" alt="WorkGuard Icon" width="32" height="32"><span style="font-family: var(--font-heading); font-weight: 800; font-size: 1.5rem; letter-spacing: -0.02em; color: var(--text-primary); text-transform: uppercase;">WorkGuard</span></div>
                </a>
                <div class="auth-subtitle">Client Portal</div>
                <h1 class="auth-title">Welcome back</h1>
                <p class="auth-desc">Sign in to manage your advisory dashboard.</p>
            </div>
            
            <form action="dashboard.html" class="auth-form js-validate-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                
                <div class="auth-actions">
                    <label class="auth-checkbox">
                        <input type="checkbox">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="auth-link">Forgot password?</a>
                </div>
                
                <button type="submit" class="auth-btn">Sign In</button>
            </form>
            
            <div class="auth-divider">or continue with</div>
            
            <div class="social-btns">
                <button type="button" class="social-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Google
                </button>
                <button type="button" class="social-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.05 2.26.68 3.08.68.76 0 2.07-.76 3.61-.63 1.62.06 2.84.62 3.6 1.77-3.08 1.83-2.58 5.73.49 6.94-.74 1.84-1.74 3.39-2.78 4.21zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                    </svg>
                    Apple
                </button>
            </div>
            
            <div class="auth-footer">
                New to WorkGuard? <a href="register.html" class="auth-link">Create an account</a>
            </div>
        </div>
    </div>

    <!-- Scripts for theme and validation -->
    <script src="assets/js/main.js"></script>
</body>
</html>
